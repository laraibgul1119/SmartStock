<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStock - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #303f96;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            border-bottom: 2px solid var(--primary);
        }
        .navbar-brand {
            color: var(--primary) !important;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .nav-link {
            color: #000000 !important;
            font-weight: 500;
        }
        .nav-link:hover {
            color: var(--primary) !important;
        }
        .btn-primary {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .btn-primary:hover,
        .btn-primary:focus {
            background-color: #252f75;
            border-color: #252f75;
            color: #ffffff;
        }
        .btn-outline-primary {
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-outline-primary:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }
        .auth-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }
        .auth-card {
            width: 100%;
            max-width: 560px;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-top: 4px solid var(--primary);
        }
        .auth-card h1 {
            color: var(--primary);
            font-weight: 700;
            font-size: 1.5rem;
        }
        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(48, 63, 150, 0.25);
        }
        .form-label {
            font-weight: 500;
            color: #000000;
        }
        .link-primary {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .link-primary:hover {
            color: #252f75;
            text-decoration: underline;
        }
        .footer {
            background-color: #000000;
            color: #ffffff;
        }
        .footer a {
            color: #ffffff;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer-brand {
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">
            <a class="navbar-brand" href="index.html">SmartStock</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-primary">Login</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Signup Form -->
    <main class="auth-wrap">
        <div class="card auth-card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="text-center mb-1">Sign Up</h1>
                <p class="text-center text-muted small mb-4">Create your SmartStock account.</p>

                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="First name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName" placeholder="Last name" required>
                        </div>

                        <div class="col-12">
                            <label for="shopName" class="form-label">Shop Name</label>
                            <input type="text" class="form-control" id="shopName" placeholder="Your shop name" required>
                        </div>

                        <div class="col-12">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
                        </div>

                        <div class="col-12">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" placeholder="03xx-xxxxxxx">
                        </div>

                        <div class="col-12">
                            <label for="role" class="form-label">Account Role</label>
                            <select class="form-select" id="role" required>
                                <option value="" selected disabled>Select a role</option>
                                <option value="admin">Admin / Shop Owner</option>
                                <option value="cashier">Cashier</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                        </div>
                        <div class="col-md-6">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label small" for="terms">
                                    I agree to the <a href="#" class="link-primary">Terms of Service</a> and <a href="#" class="link-primary">Privacy Policy</a>.
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                    </div>
                </form>

                <hr class="my-4">

                <p class="text-center small mb-0">
                    Already have an account? <a href="login.html" class="link-primary">Login</a>
                </p>
                <p class="text-center small mt-2 mb-0">
                    <a href="index.html" class="link-primary">Back to Home</a>
                </p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer py-4">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-4 text-md-start text-center">
                    <span class="footer-brand">SmartStock</span>
                </div>
                <div class="col-md-4 text-center">
                    <span class="small">&copy; 2026 SmartStock. All rights reserved.</span>
                </div>
                <div class="col-md-4 text-md-end text-center">
                    <a href="index.html" class="small">Home</a>
                    <span class="small ms-3 me-3">|</span>
                    <a href="login.html" class="small">Login</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
